function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==='object'){const o={};for(const k in a)o[k]=merge(a[k],b?.[k]);for(const k in b||{})if(!(k in o))o[k]=b[k];return o}return b===undefined?a:b}

function daysAgo(d){return (Date.now()-new Date(d).getTime())/864e5}
function muscleRecovery(m){const entries=S.workouts.filter(w=>w.completed).flatMap(w=>w.exercises.filter(e=>e.p===m||e.s.includes(m)).map(e=>({d:w.date,sets:e.sets.filter(s=>s.done).length,fb:e.feedback}))).sort((a,b)=>new Date(b.d)-new Date(a.d));if(!entries.length)return 100;const x=entries[0];const half= m==='Quadriceps'||m==='Glutes'||m==='Hamstrings'?50:38;let fatigue=Math.min(70,18+x.sets*9+(x.fb==='tooHard'?14:x.fb==='hard'?7:0));return Math.round(Math.min(100,Math.max(18,100-fatigue*Math.exp(-daysAgo(x.d)*24/half))))}

function equipmentControls(includePositions=true){const labels={bodyweight:'Bodyweight',dumbbells:'Dumbbells',bands:'Resistance bands',anchor:'Secure band anchor',chair:'Stable chair',counter:'Counter / stable support',bench:'Adjustable incline bench',stairs:'Stable step / stairs',outdoors:'Outdoor walking route',hill:'Hill'};return `<details class="details" open><summary>Equipment${includePositions?' &amp; positions':''}</summary><p class="small muted">Equipment for ${locName(S.readiness.location)}</p>${Object.entries(labels).map(([q,label])=>`<label class="check"><input type="checkbox" ${locationEq().includes(q)?'checked':''} onchange="setEquipment('${q}',this.checked)"><span>${label}</span></label>`).join('')}${includePositions?positionControls()+exclusionControls():''}</details>`;}
function compatible(ex){const e=locationEq();if(S.profile.avoidHeadBelowHeart&&(ex.headBelowHeart||ex.position==='headBelowHeart'))return false;if(S.profile.avoidHeadFlat&&(ex.headFlat||ex.position==='flat'))return false;const position=ex.position||(/seated/i.test(ex.name)?'seated':/incline/i.test(ex.name)?'incline':'standing');if((ex.positions||[position]).some(p=>['standing','seated','incline'].includes(p)&&!(S.profile.allowedPositions||['standing','seated','incline']).includes(p)))return false;return ex.eq.every(q=>e.includes(q)||q==='dumbbells'&&e.includes('dumbbells'))}

function chooseKind(){if(S.readiness.workoutType&&S.readiness.workoutType!=='auto')return S.readiness.workoutType;if(S.readiness.location==='outdoors')return readinessScore()<55?'recovery':'conditioning';if(S.readiness.soreness==='aLot'||readinessScore()<48)return 'recovery';const n=weekStrengthCount();if(n<S.profile.minStrength)return 'strength';if(n>=S.profile.maxStrength)return readinessScore()>72?'conditioning':'recovery';return readinessScore()>=62?'strength':'conditioning'}

function generate(){stopCoach();if(!S.readiness.workoutType)S.readiness.workoutType='mixed';const kind=chooseKind();const minutes=+S.readiness.minutes||30;let items=[];if(kind==='strength'||kind==='mixed'){

 const cardioSlots=kind==='mixed'?(S.buildMode==='count'?Math.max(1,Math.min(20,+S.cardioCount||2)):1):0;const desired=kind==='mixed'&&S.buildMode==='time'?Math.max(1,fullDesired-cardioSlots):fullDesired;

 }else{let pool=EX.filter(x=>x.type===kind&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never');let block=Math.max(2,Math.min(6,Math.round(minutes/8)));const requested=S.buildMode==='count'?(kind==='conditioning'?Math.max(1,Math.min(20,+S.cardioCount||2)):S.exerciseCount):block;items=(kind==='conditioning'?selectCardio(pool,requested):pool.sort(()=>Math.random()-.5).slice(0,requested)).map(makeWorkoutEx)}

function selectCardio(pool,count){const ranked=pool.map(e=>({e,score:preferenceScore(e)-recentPenalty(e)+Math.random()*8})).sort((a,b)=>b.score-a.score).map(x=>x.e);const selected=[],seen=new Set();for(const e of ranked){const key=cardioMovementKey(e);if(!seen.has(key)){selected.push(e);seen.add(key);}if(selected.length>=count)return selected;}for(const e of ranked){if(!selected.some(x=>x.id===e.id))selected.push(e);if(selected.length>=count)break;}return selected;}

function workoutView(){const w=activeWorkout;return `<section class="card"><div class="row" style="flex-wrap:wrap"><div><div class="eyebrow">${w.kind}</div><h2>${w.title}</h2><div class="muted small">${w.exercises.length} exercises · ${S.buildMode==='time'?w.minutes+' min goal · ':''}${locName(S.readiness.location)}</div></div><div class="seg" style="flex-wrap:wrap;flex-shrink:0"><button class="${S.coach&&!S.avatarMode?'active':''}" onclick="setWorkoutView(true)">Single View</button><button class="${!S.coach?'active':''}" onclick="setWorkoutView(false)">Full Plan</button><button class="${S.avatarMode?'active':''}" onclick="setWorkoutView('avatar')">Avatar Coach</button></div></div><details class="details"><summary>Why this workout?</summary><ul class="list small muted">${w.rationale.map(x=>`<li>${x}</li>`).join('')}</ul></details><div class="chipline" style="margin-top:12px"><button class="secondary" onclick="editWorkout()">Edit workout</button><button class="secondary" onclick="undo()">Undo</button><button class="secondary" onclick="addExercise()">+ Add exercise</button><button class="secondary" onclick="replaceWorkout()">Alternative workout</button></div><p class="small muted">Focus on controlled technique. ${S.repSeconds} seconds/rep is an optional pace guide, not a deadline. Rest whenever needed.</p></section>${S.avatarMode?avatarCoachView(w):S.coach?coachView(w):fullView(w)}<div class="container" style="padding-top:0"><button class="primary" onclick="finishPrompt()">Finish workout</button><button class="secondary" style="width:100%;margin-top:8px" onclick="if(confirm('Discard unsaved workout?')){stopCoach();activeWorkout=null;saveActive();render()}">Discard workout</button></div>`}
function demoMedia(e){
  const q=encodeURIComponent(e.name+' exercise proper form');
  const photo='https://www.google.com/search?tbm=isch&q='+q;
  const video='https://www.youtube.com/results?search_query='+q;
  return coachControls(e)+embeddedDemo(e)+`<div class="demo-media"><b>See this movement performed by a person</b><p class="small muted">Real exercise photos and videos open in your browser. Choose demonstrations that match your exercise and position restrictions.</p><div class="grid2"><a class="media-link" target="_blank" rel="noopener noreferrer" href="${photo}">📷 Real photos ↗</a><a class="media-link" target="_blank" rel="noopener noreferrer" href="${video}">▶ Videos ↗</a></div></div>`;
}
function coachView(w){const e=w.exercises[Math.min(coachIndex,w.exercises.length-1)];const i=w.exercises.indexOf(e);return `<div class="container" style="padding-top:0"><section class="card coach"><div class="row"><span class="badge">${i+1} of ${w.exercises.length}</span><button class="secondary" onclick="showAlternatives('${e.id}')">Alternative</button></div><div class="eyebrow" style="margin-top:16px">${exerciseTypeLabel(e)} · ${e.p}</div><h2 style="font-size:27px">${e.name}</h2>${demoMedia(e)}${setsHTML(e,i)}<details class="details"><summary>How to do it</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol>${e.tips?.length?`<div class="notice">${e.tips.join(' ')}</div>`:''}</details>${e.type==='strength'?feedbackHTML(e,i):''}<div class="coach-nav"><button class="secondary" ${i===0?'disabled':''} onclick="coachNext(-1)">Back</button><button class="secondary" ${i===w.exercises.length-1?'disabled':''} onclick="coachNext(1)">Next</button></div></section></div>`}
function fullView(w){return `<div class="container" style="padding-top:0">${workoutSections(w)}${w.exercises.map((e,i)=>`<section class="workout-card"><div class="row"><div><div class="exercise-title">${e.name}</div><span class="badge">${exerciseTypeLabel(e)} · ${e.p}</span></div><button class="secondary" onclick="showAlternatives('${e.id}')">Alternative</button></div>${demoMedia(e)}${setsHTML(e,i)}<details class="details"><summary>Technique</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol></details>${e.type==='strength'?feedbackHTML(e,i):''}</section>`).join('')}</div>`}
function setsHTML(e,ei){if(e.type!=='strength')return `<div class="sets"><label class="check"><input type="checkbox" ${e.sets[0].done?'checked':''} onchange="updateSet(${ei},0,'done',this.checked)"><span><b>${e.sets[0].minutes} minutes</b> · mark complete</span></label></div>`;return `<div class="sets">${e.sets.map((s,si)=>`<div class="setrow"><b>${si+1}</b><input aria-label="weight" type="number" inputmode="decimal" value="${s.weight}" onchange="updateSet(${ei},${si},'weight',this.value)"><input aria-label="reps" type="number" inputmode="numeric" value="${s.reps}" onchange="updateSet(${ei},${si},'reps',this.value)"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet(${ei},${si},'done',this.checked)"></div>`).join('')}<div class="small muted">Weight · reps · ✓</div></div>`}
function feedbackHTML(e,ei){return `<div class="details"><b>How was that?</b><div class="feedback">${[['easy','Too easy'],['right','Just right'],['hard','Hard but doable'],['tooHard','Too hard']].map(x=>`<button class="${e.feedback===x[0]?'selected':''}" onclick="setFeedback(${ei},'${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function history(){return `<div class="container"><section class="card"><div class="eyebrow">History</div><h1>Your work counts.</h1><p class="muted">Completed workouts and manually logged purposeful movement.</p></section>${S.workouts.length?S.workouts.map(w=>`<section class="card"><div class="row"><div><h3>${w.title}</h3><div class="small muted">${new Date(w.date).toLocaleString()} · ${w.kind}</div></div><span class="pill">${w.exercises.length} items</span></div><div class="small">${w.exercises.map(e=>e.name).join(' · ')}</div>${w.calories?`<p class="small" style="margin-top:10px"><b>Estimated calories:</b> ${w.calories.active} active kcal · ${w.calories.total} total kcal · ${w.calories.minutes} min</p>`:''}<button class="secondary" style="margin-top:10px" onclick="openWorkoutSummary('${w.id}')">View summary</button></section>`).join(''):'<div class="empty">No workouts saved yet.</div>'}${S.movements.map(m=>`<section class="card"><h3>${m.type}</h3><div class="small muted">${new Date(m.date).toLocaleString()}${movementMeasures(m)?' · '+movementMeasures(m):''}</div>${m.note?`<p class="small">${m.note}</p>`:''}</section>`).join('')}</div>`}

const CALORIE_ACTIVITIES=[
 ['resistance','Resistance training · general',3.5],
 ['bodyweight','Bodyweight resistance · general',3.0],
 ['circuitLight','Circuit workout · light',3.5],
 ['circuitModerate','Circuit workout · moderate',5.0],
 ['resistanceVigorous','Resistance training · vigorous',6.0],
 ['walkSlow','Walking · slow, level',2.8],
 ['walk','Walking · comfortable, level',3.5],
 ['hill','Hill walking · moderate, gentle grade',5.3],
 ['stairs','Stair climbing · slow',4.5],
 ['guidedLight','Gentle seated / guided movement',2.5],
 ['mobility','Gentle stretching / mobility',2.3]
];
function calculateCalories(weightLb,minutes,activity){
 const selected=CALORIE_ACTIVITIES.find(x=>x[0]===activity);
 if(!selected||!Number.isFinite(weightLb)||weightLb<40||weightLb>1000||!Number.isFinite(minutes)||minutes<=0||minutes>720)return null;
 const kg=weightLb*.45359237,met=selected[2];
 return {weightLb,minutes,activity,met,total:Math.round(met*kg*minutes/60),active:Math.round((met-1)*kg*minutes/60)};
}
function calorieSummary(w){
 const c=w.calories,choice=c?.activity||(w.kind==='mixed'?'circuitLight':w.kind==='strength'?'resistance':w.kind==='recovery'?'mobility':w.exercises.every(e=>e.position==='seated')?'guidedLight':'walk');
 return `<section class="details"><h3>Estimated calories burned</h3><div id="calorie-result">${calorieResult(c)}</div><div class="grid2"><div class="field"><label for="calorie-minutes">Actual workout minutes</label><input id="calorie-minutes" type="number" inputmode="decimal" min="1" max="720" value="${c?.minutes||''}" placeholder="Time you actually exercised"></div><div class="field"><label for="calorie-weight">Body weight (lb)</label><input id="calorie-weight" type="number" inputmode="decimal" min="40" max="1000" value="${c?.weightLb||S.calorieWeightLb||''}" placeholder="Enter once; remembered"></div></div><div class="field"><label for="calorie-activity">Activity / effort that best matches this session</label><select id="calorie-activity">${CALORIE_ACTIVITIES.map(([id,label])=>`<option value="${id}" ${choice===id?'selected':''}>${label}</option>`).join('')}</select></div><button class="primary" onclick="saveWorkoutCalories('${w.id}')">Calculate &amp; save calories</button><p class="small muted" style="margin-top:10px">Use actual session time including normal set rests, but exclude long breaks. Estimates use weight, time, and the activity you choose; they are not measured calories. Active calories exclude resting energy; total calories include it.</p><details><summary class="small">Calculation source</summary><p class="small">MET × body weight in kg × hours. Active calories use MET minus 1. Activity estimates: <a href="https://pacompendium.com/conditioning-exercise/" target="_blank" rel="noopener">2024 Adult Compendium</a> and <a href="https://pacompendium.com/walking/" target="_blank" rel="noopener">walking activities</a>.</p></details></section>`;
}
function calorieResult(c){return c?`<div class="grid2" style="margin-bottom:12px"><div class="stat"><strong>~${c.active} kcal</strong><span class="small">Estimated active calories</span></div><div class="stat"><strong>~${c.total} kcal</strong><span class="small">Estimated total calories</span></div></div>`:'<p class="small muted">Enter actual minutes and your weight to calculate. Your workout is already saved.</p>';}
function saveWorkoutCalories(id){
 const w=S.workouts.find(x=>x.id===id);if(!w)return;
 const c=calculateCalories(Number(document.getElementById('calorie-weight').value),Number(document.getElementById('calorie-minutes').value),document.getElementById('calorie-activity').value);
 if(!c){toast('Enter a weight from 40–1000 lb and workout time from 1–720 minutes.');return;}
 w.calories=c;S.calorieWeightLb=c.weightLb;save();document.getElementById('calorie-result').innerHTML=calorieResult(c);render();toast('Calorie estimate saved with your workout');
}
function openWorkoutSummary(id){
 const w=S.workouts.find(x=>x.id===id);if(!w)return;
 showModal(`<h2>Workout summary</h2><p>${w.exercises.length} exercises · ${w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} logged sets</p><p>Completed reps: ${w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).reduce((v,z)=>v+(z.reps||0),0),0)}</p>${calorieSummary(w)}`);
}

function progress(){const total=S.workouts.length;const week=weekStrengthCount();const mastered=Object.keys(S.strength).length;const rec=MUSCLES.map(m=>({m,r:muscleRecovery(m)}));return `<div class="container"><section class="card"><div class="eyebrow">Progress</div><h1>Capability over punishment.</h1><p class="muted">SteadyStrong emphasizes consistency, strength progress, stamina, and how you feel—not just scale weight.</p><div class="grid3"><div class="stat"><strong>${total}</strong><span class="small muted">Workouts</span></div><div class="stat"><strong>${week}</strong><span class="small muted">Strength / 7d</span></div><div class="stat"><strong>${mastered}</strong><span class="small muted">Tracked lifts</span></div></div></section><section class="card"><h3>Muscle recovery</h3>${rec.map(x=>`<div class="progress-row"><div class="row small"><b>${x.m}</b><span>${x.r}%</span></div><div class="bar"><span style="width:${x.r}%"></span></div></div>`).join('')}</section><section class="card"><h3>Strength estimates</h3>${Object.keys(S.strength).length?Object.entries(S.strength).map(([id,v])=>{const ex=ALL_EX.find(x=>x.id===id);return `<div class="row" style="padding:8px 0"><span>${ex?.name||id}</span><b>${v.nextWeight} lb next</b></div>`}).join(''):'<p class="muted small">Finish some strength workouts and SteadyStrong will begin adapting recommended loads.</p>'}</section></div>`}
function settings(){return `<div class="container"><section class="card"><div class="eyebrow">Your plan</div><h1>Personalized for you</h1><div class="field"><label>Default workout length</label><select onchange="S.profile.duration=+this.value;S.readiness.minutes=+this.value;save()">${[20,30,35,40,45].map(x=>`<option ${S.profile.duration==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Minimum strength days</label><input type="number" min="1" max="6" value="${S.profile.minStrength}" onchange="S.profile.minStrength=+this.value;save()"></div><div class="field"><label>Maximum strength days</label><input type="number" min="1" max="7" value="${S.profile.maxStrength}" onchange="S.profile.maxStrength=+this.value;save()"></div></div><label class="check"><input type="checkbox" ${S.profile.protectTomorrow?'checked':''} onchange="S.profile.protectTomorrow=this.checked;save()"><span><b>Protect tomorrow</b><br><span class="small muted">Cap lower-body dose so strength work doesn't routinely make the next morning miserable.</span></span></label></section><section class="card"><h3>Workout controls</h3><div class="field"><label>Default rest between sets (seconds)</label><input type="number" min="0" max="300" value="${S.restSeconds}" onchange="S.restSeconds=Math.max(0,+this.value||0);save()"></div><div class="field"><label>Optional pace guide per rep (seconds)</label><input type="number" min="0" max="15" value="${S.repSeconds}" onchange="S.repSeconds=Math.max(0,+this.value||0);save()"></div></section><section class="card"><h3>Equipment profiles</h3><div class="field"><label for="equipmentLocation">Edit equipment for</label><select id="equipmentLocation" onchange="S.readiness.location=this.value;save();render()">${[['home','Home'],['gym','Apartment Gym'],['outdoors','Outdoors']].map(([v,label])=>`<option value="${v}" ${S.readiness.location===v?'selected':''}>${label}</option>`).join('')}</select></div>${equipmentControls(false)}</section><section class="card"><h3>Position rules</h3>${positionControls()}${exclusionControls()}</section><section class="card"><h3>Exercise preferences</h3><p class="muted small">All 100 strength exercises are combination moves with a multi-joint stage and different muscle groups. One repetition completes the whole sequence.</p><p class="muted small">Tap any exercise to tell SteadyStrong to show it more, less, or never. Lunges are not restricted.</p>${EX.filter(x=>x.type==='strength').map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #f2f4f7"><span>${x.name}</span><select style="width:120px;padding:7px;border:1px solid var(--line);border-radius:9px" onchange="S.prefs['${x.id}']=this.value;save()"><option value="neutral" ${(S.prefs[x.id]||'neutral')==='neutral'?'selected':''}>Neutral</option><option value="more" ${S.prefs[x.id]==='more'?'selected':''}>More</option><option value="less" ${S.prefs[x.id]==='less'?'selected':''}>Less</option><option value="never" ${S.prefs[x.id]==='never'?'selected':''}>Never</option></select></div>`).join('')}</section><section class="card"><h3>Data</h3><button class="secondary" onclick="exportData()">Export backup</button> <button class="secondary danger" onclick="if(confirm('Reset all SteadyStrong data?')){localStorage.removeItem('forgefit');localStorage.removeItem('forgefit-active');location.reload()}">Reset</button><p class="small muted" style="margin-top:10px">Your workout history is stored in Safari on this iPhone. This version does not have HealthKit access.</p></section></div>`}
function movementModal(){showModal(`<h2>Log movement</h2><div class="field"><label>Type</label><select id="mvtype"><option>Walk</option><option>Hill walk</option><option>Stairs</option><option>Mobility</option><option>Other purposeful movement</option></select></div><p class="small muted">Enter time, distance, or both.</p><div class="grid2"><div class="field"><label for="mvmin">Time (minutes)</label><input id="mvmin" type="number" inputmode="decimal" min="0.1" max="720" step="any" placeholder="Optional"></div><div class="field"><label for="mvmiles">Distance (miles)</label><input id="mvmiles" type="number" inputmode="decimal" min="0.01" max="300" step="any" placeholder="Optional"></div></div><div class="field"><label>Optional note</label><input id="mvnote" placeholder="How it felt, route, etc."></div><button class="primary" onclick="logMovement()">Save movement</button>`)}
function logMovement(){const timeRaw=document.getElementById('mvmin').value.trim(),milesRaw=document.getElementById('mvmiles').value.trim(),minutes=timeRaw===''?null:Number(timeRaw),miles=milesRaw===''?null:Number(milesRaw);if((minutes===null&&miles===null)||(minutes!==null&&(!Number.isFinite(minutes)||minutes<=0||minutes>720))||(miles!==null&&(!Number.isFinite(miles)||miles<=0||miles>300))){toast('Enter positive minutes, miles, or both (up to 720 minutes / 300 miles).');return;}S.movements.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),type:document.getElementById('mvtype').value,minutes,miles,note:document.getElementById('mvnote').value});save();closeModal();toast('Movement saved');render()}
function movementMeasures(m){return [Number(m.minutes)>0?m.minutes+' min':null,Number(m.miles)>0?m.miles+' miles':null].filter(Boolean).join(' · ');}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SteadyStrong-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function cap(s){return s[0].toUpperCase()+s.slice(1)}

let foodCategory='cook',foodQuery='';
function foodText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setFoodCategory(c){foodCategory=c;foodQuery='';render();}
function foodResults(){
 const q=foodQuery.toLowerCase().trim();
 const target=document.getElementById('foodResults');if(!target)return;
 if(foodCategory==='facts'){
  const list=FOOD_FACTS.filter(f=>f.join(' ').toLowerCase().includes(q));
  target.innerHTML=`<p class="small muted" role="status">${list.length} foods and meals</p>`+(list.map((f)=>{const id=FOOD_FACTS.indexOf(f);return `<article class="card"><h3>${foodText(f[0])}</h3><p class="small muted">Reference portion: ${foodText(f[1])}</p>${f[8]?`<details class="details"><summary>Meal ingredients</summary><p class="small">${foodText(f[8])}. No extra sauce, drink, or topping included.</p></details>`:''}<div class="field"><label for="portion-${id}">Portions of the reference serving</label><input id="portion-${id}" type="number" min="0.25" max="20" step="0.25" value="1" oninput="scaleFood(${id},this.value)"></div><div id="nutrients-${id}">${foodNutrients(f,1)}</div><p class="small muted">${foodText(f[7]||'Approximate generic values; brands and preparation vary.')}</p></article>`}).join('')||'<div class="empty">No matches. Try chicken, oats, pasta, or yogurt.</div>');
 }else{
 const list=FOOD_SWAPS.filter(f=>f.cat===foodCategory&&[f.title,f.swap,f.note,f.goal].join(' ').toLowerCase().includes(q));
 target.innerHTML=`<p class="small muted" role="status">${list.length} substitutions</p>`+(list.map(f=>`<article class="card"><span class="tag">${foodText(f.goal)}</span><h3 style="margin-top:10px">${foodText(f.title)}</h3><p><b>Try:</b> ${foodText(f.swap)}</p>${f.cal?`<div class="notice">${foodText(f.cal)}</div>`:''}<p class="small muted" style="margin-top:10px">${foodText(f.note)}</p></article>`).join('')||'<div class="empty">No matches in this section. Try another section or a simpler search.</div>');
 }
}
function foodNutrients(f,n){return '<div class="grid3">'+['Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)','Fiber (g)'].map((label,j)=>`<div class="stat"><span class="small">${label}</span><strong>${Math.round(f[j+2]*n*10)/10}</strong></div>`).join('')+'</div>';}
function scaleFood(id,value){const n=Number(value),el=document.getElementById('nutrients-'+id);el.innerHTML=Number.isFinite(n)&&n>=.25&&n<=20?foodNutrients(FOOD_FACTS[id],n):'<p class="small">Enter between 0.25 and 20 portions.</p>';}
function food(){return `<div class="container"><section class="card hero"><div class="eyebrow">Cooking · cravings · eating out</div><h1>Food substitutions</h1><p>Keep the flavors you enjoy. Find an ingredient alternative, a lighter option, or more protein and fiber.</p><div class="seg" role="group" aria-label="Food sections">${[['cook','Cooking'],['sweet','Sweet'],['salty','Salty'],['restaurant','Restaurants'],['facts','Nutrition']].map(([id,label])=>`<button class="${foodCategory===id?'active':''}" aria-pressed="${foodCategory===id}" onclick="setFoodCategory('${id}')">${label}</button>`).join('')}</div><div class="field" style="margin-top:16px"><label for="foodSearch">Search this section</label><input id="foodSearch" type="search" placeholder="Try butter, chocolate, burger, chicken…" value="${foodText(foodQuery)}" oninput="foodQuery=this.value;foodResults()"></div><p class="small muted">${foodCategory==='restaurant'?'Restaurant calories are broad illustrative ranges, not verified chain menu values. Portions, sauces, sides, and drinks can change the total. Check the restaurant’s current nutrition information for exact orders.':foodCategory==='facts'?'Reference estimates, not product labels. Portions scale all displayed nutrients. Meal totals are calculated from the listed ingredients; actual recipes vary.':'A broad practical collection, not every possible substitution. Baking swaps depend on the recipe. Lower-calorie, higher-protein, and ingredient alternatives are labeled separately.'}</p></section>${foodCategory==='sweet'||foodCategory==='salty'?'<section class="card"><h3>Match the craving</h3><p class="small">Think about sweet or salty, creamy or crunchy, and warm or cold. If you are hungry, choose a satisfying snack with protein. If you are thirsty, have some water too. A smaller portion of the food you want is always an option.</p></section>':''}<div id="foodResults"></div><section class="card"><details><summary><b>How to compare foods</b></summary><ul class="list small"><li>Compare the same amount: grams, cups, or a clearly defined meal.</li><li>Measure calorie-dense additions such as oil, butter, dressing, nuts, and cheese.</li><li>Whole-grain, gluten-free, vegan, and low-carb do not automatically mean lower-calorie.</li><li>For packaged foods, use the product label for sodium, added sugar, saturated fat, and micronutrients. Missing values here are unknown, not zero.</li><li>For ingredient exclusions, check labels and restaurant preparation; swaps can introduce different allergens.</li></ul></details><details class="details"><summary>Reference sources</summary><p class="small">Cooking guidance: <a href="https://extension.umd.edu/resource/recipe-swaps-common-substitutions-making-recipes-healthier-fs-1174" target="_blank" rel="noopener">University of Maryland Extension</a>. Dining guidance: <a href="https://www.fda.gov/food/nutrition-education-resources-materials/calories-menu" target="_blank" rel="noopener">FDA menu calories</a>. Selected fruit and seafood entries: <a href="https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/nutrition-information-raw-fruits-vegetables-and-fish" target="_blank" rel="noopener">FDA nutrition tables</a>. Other foods are rounded generic estimates; meals are calculated examples.</p></details></section></div>`;}

  if(kind==='inclinePress'){extra+='<path d="M146 78L104 151M104 151H64M82 151V224M134 98L161 222" fill="none" stroke="#94a3b8" stroke-width="8"/>';head=[140,49];torso=[120,75,145,88,109,151,82,140];arms=phase?[[120,79,143,52,162,18],[143,87,170,62,187,28]]:[[120,79,94,91,115,56],[143,87,161,114,179,79]];legs=[[89,143,62,172,61,222],[104,147,117,179,119,222]];}
 }
 if(/supported/.test(e.id)&&!['supportedRow','triceps'].includes(kind)){extra+=support();arms[1]=[141,85,159,111,184,129];}
 let bands='';
 if(band){let a=arms[0],b=arms[1];if(['row','chest','pallof'].includes(kind)||e.id==='combo_band_row_curl'){const ax=kind==='chest'?16:218;bands=line(`${ax},95 ${a[4]},${a[5]} ${ax},95 ${b[4]},${b[5]}`,'#ef9f22',3)+`<circle cx="${ax}" cy="95" r="6" fill="#475569"/>`;}
 else if(kind==='pull')bands=line(`${a[4]},${a[5]} ${b[4]},${b[5]}`,'#ef9f22',4);
 else if(kind==='pressdown')bands=line(`110,9 ${a[4]},${a[5]} 110,9 ${b[4]},${b[5]}`,'#ef9f22',3);
 else if(['legCurl','kickback','sideLeg','sideStep'].includes(kind))bands=line(`18,218 ${legs[0][4]},${legs[0][5]}`,'#ef9f22',4);
 else bands=line(`93,225 ${a[4]},${a[5]} 93,225 127,225 ${b[4]},${b[5]}`,'#ef9f22',3);}
 const limb=(a,leg=false)=>line(`${a[0]},${a[1]} ${a[2]},${a[3]} ${a[4]},${a[5]}`,'#24334e',leg?21:15)+line(`${a[0]},${a[1]} ${a[2]},${a[3]} ${a[4]},${a[5]}`,'#dba17e',leg?15:10)+(leg?line(`${a[0]},${a[1]} ${a[2]},${a[3]}`,'#334766',17):'');
 const dumb=(x,y)=>`<g transform="translate(${x},${y})"><rect x="-12" y="-3" width="24" height="6" rx="2" fill="#475569"/><rect x="-15" y="-8" width="7" height="16" rx="2" fill="#182a47"/><rect x="8" y="-8" width="7" height="16" rx="2" fill="#182a47"/></g>`;
 const feet=legs.map(a=>`<path d="M${a[4]-9} ${a[5]+2}h19l6 7h-28z" fill="#26364f"/><path d="M${a[4]-10} ${a[5]+9}h26" stroke="#fff" stroke-width="2"/>`).join('');
 const weights=weighted?arms.map(a=>dumb(a[4],a[5])).join(''):'';
 return `<svg viewBox="0 0 230 246" role="img" aria-label="${esc(e.name+' — '+MOVE_LABELS[kind]+(phase?' action':' start'))}" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="228" height="244" rx="16" fill="#f3f6ff"/><path d="M13 232H217" stroke="#cbd5e1" stroke-width="2"/>${extra}${bands}${legs.map(a=>limb(a,true)).join('')}<polygon points="${torso[0]},${torso[1]} ${torso[2]},${torso[3]} ${torso[4]},${torso[5]} ${torso[6]},${torso[7]}" fill="#5267e8" stroke="#3346b3" stroke-width="2"/><path d="M${(torso[0]+torso[2])/2} ${torso[1]+12}L${(torso[4]+torso[6])/2} ${torso[5]-6}" stroke="#8da2ff" stroke-width="3" opacity=".7"/>${arms.map(a=>limb(a)).join('')}<rect x="${head[0]-5}" y="${head[1]+12}" width="10" height="14" rx="4" fill="#dba17e"/><ellipse cx="${head[0]}" cy="${head[1]}" rx="16" ry="20" fill="#eab48f" stroke="#b98260" stroke-width="1"/><path d="M${head[0]-16} ${head[1]-2}q-2-25 17-23q19 2 15 20q-10-11-19-7z" fill="#26364f"/><circle cx="${head[0]-5}" cy="${head[1]}" r="1.5" fill="#26364f"/><circle cx="${head[0]+5}" cy="${head[1]}" r="1.5" fill="#26364f"/><path d="M${head[0]-4} ${head[1]+9}q4 3 8 0" fill="none" stroke="#9b634c" stroke-width="1.5"/>${feet}${weights}</svg>`;
}
function embeddedDemo(e){const parts=DEMO_MOVES[e.id];if(!parts)return '';return `<section class="embedded-demo"><div class="row"><b>How to move</b><span class="badge">Built-in illustrations</span></div>${parts.map((m,i)=>`<div class="demo-part"><h3>${parts.length>1?(i+1)+'. ':''}${MOVE_LABELS[m]}</h3><div class="pose-grid"><figure>${demoPose(m,0,e)}<figcaption>Start</figcaption></figure><figure>${demoPose(m,1,e)}<figcaption>${['walk','hill','carry','mobility'].includes(m)?'Move smoothly':'Action · return slowly'}</figcaption></figure></div></div>`).join('')}<ol class="demo-cues">${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${e.tips?.length?`<p class="small muted">${e.tips.map(esc).join(' ')}</p>`:''}</section>`;}


function exerciseTypeLabel(e){return e.type==='strength'?'Strength':e.type==='conditioning'?'Cardio':'Recovery';}
function workoutSections(w){const strength=w.exercises.filter(e=>e.type==='strength'),cardio=w.exercises.filter(e=>e.type==='conditioning');return `<section class="card"><h3>Workout sections</h3>${strength.length?`<p><b>Strength:</b> ${strength.length} exercises · ${strength.reduce((n,e)=>n+e.sets.length,0)} sets</p>`:''}${cardio.length?`<p><b>Cardio:</b> ${cardio.length} activities · ${cardio.reduce((n,e)=>n+e.sets.reduce((v,s)=>v+(s.minutes||0),0),0)} minutes</p>`:''}<p class="small muted">Each exercise has its own Alternative button. Strength stays strength; cardio stays cardio.</p></section>`;}

function coachAvatar(style){
 const woman=style==='woman',drill=style==='drill',skin=woman?'#e5a77f':drill?'#c78c68':'#c18a68',shirt=drill?'#65724d':woman?'#6b5de8':'#2863ad';
 const hair=woman?'<path d="M39 60Q18 63 22 104Q40 102 43 74" fill="#422a35"/><path d="M49 35Q18 47 35 77L45 62Z" fill="#422a35"/>':'<path d="M37 53Q28 14 62 15Q98 18 90 54L79 32L45 37Z" fill="#28344a"/>';
 const hat=drill?'<path d="M27 34L41 14H83L96 34Z" fill="#46523b" stroke="#2d3b2b" stroke-width="2"/><path d="M21 35Q63 26 105 35L104 41H22Z" fill="#374731"/><path d="M58 23L62 19L66 23L62 29Z" fill="#e7cd86"/>':'';
 return `<svg class="coach-avatar" viewBox="0 0 128 128" role="img" aria-label="${woman?'Woman coach':drill?'Drill Sergeant coach':'Man coach'}" xmlns="http://www.w3.org/2000/svg"><circle cx="64" cy="64" r="63" fill="${drill?'#eef0df':woman?'#f0edff':'#e7f0ff'}"/>${hair}<path d="M18 127Q19 89 48 84H80Q108 91 110 127Z" fill="${shirt}"/><path d="M53 77H75V95Q64 109 53 95Z" fill="${skin}"/><path d="M43 87L53 95L64 107L75 95L85 87" fill="none" stroke="${drill?'#d8d9b7':'#c5d6ff'}" stroke-width="3"/><ellipse cx="64" cy="57" rx="27" ry="34" fill="${skin}"/><path d="M39 45Q34 13 63 15Q94 18 91 43Q68 42 58 29Q49 40 39 45Z" fill="${woman?'#422a35':'#28344a'}"/>${hat}<path d="M48 51Q54 ${drill?'46':'48'} 60 51M69 51Q76 ${drill?'46':'48'} 82 51" fill="none" stroke="#4d342c" stroke-width="2.5" stroke-linecap="round"/><circle cx="54" cy="57" r="2.5" fill="#263247"/><circle cx="76" cy="57" r="2.5" fill="#263247"/><path d="M64 57L61 68L67 69" fill="none" stroke="#a5664c" stroke-width="2" stroke-linecap="round"/>${!woman?'<path d="M43 72Q47 88 64 89Q81 88 86 71Q72 85 64 79Q55 84 43 72Z" fill="#563e35" opacity=".22"/>':''}<ellipse class="avatar-mouth" cx="64" cy="77" rx="8" ry="${drill?'2':'3'}" fill="#7b4236"/><path d="M${drill?'49':'36'} 108H${drill?'59':'47'}M79 109H93" stroke="${drill?'#e7cd86':'#b9caff'}" stroke-width="3" stroke-linecap="round"/>${drill?'<path d="M37 116L42 112L47 116M37 121L42 117L47 121" fill="none" stroke="#e7cd86" stroke-width="2"/>':''}</svg>`;
}
function coachControls(e){const style=S.coachStyle||'woman';return `<section class="spoken-coach" aria-label="Avatar exercise coach"><div class="row"><b>Choose your avatar coach</b><span class="badge">Spoken guidance</span></div><div class="avatar-choices">${[['woman','Woman'],['man','Man'],['drill','Drill Sergeant']].map(([v,t])=>`<button class="avatar-choice ${style===v?'selected':''}" aria-pressed="${style===v}" onclick="setCoachStyle('${v}','${e.id}')">${coachAvatar(v)}<span>${t}</span></button>`).join('')}</div><div class="coach-dialogue"><span class="coach-name">${style==='woman'?'Woman coach':style==='man'?'Man coach':'Drill Sergeant'}</span><p id="voice-status-${e.id}" role="status" aria-live="polite">I’ll explain ${esc(e.name)} and the key form points. Tap your coach or Start coach.</p></div><div class="grid2"><button class="primary" onclick="speakExercise('${e.id}')">▶ Start coach</button><button class="secondary" onclick="stopCoach()">■ Stop</button></div><label class="check"><input type="checkbox" ${S.voice?'checked':''} onchange="S.voice=this.checked;save();if(this.checked)speakExercise('${e.id}');else stopCoach()"><span>Speak when I move to the next exercise</span></label><details><summary class="small">Voice settings</summary><p class="small muted">Choose a device voice for each coach.</p><div class="field"><label>Voice for this coach</label><select onchange="setCoachVoice(this.value)"><option value="">Automatic voice</option>${voiceList().map(v=>`<option value="${esc(v.voiceURI)}" ${S.coachVoices?.[style]===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div></details></section>`;}
function avatarCoachView(w){return `<div class="avatar-mode">${coachView(w)}</div>`;}
function animateCoach(on){document.querySelectorAll('.avatar-choice.selected').forEach(el=>el.classList.toggle('is-speaking',on));}
let coachUtterances=[],lastSpokenExercise=null;
function voiceList(){return ('speechSynthesis' in window)?window.speechSynthesis.getVoices():[];}
function setCoachStyle(v,id){stopCoach();S.coachStyle=v;save();render();if(activeWorkout){const e=activeWorkout.exercises.find(x=>x.id===id)||activeWorkout.exercises[Math.min(coachIndex,activeWorkout.exercises.length-1)];if(e)speakExercise(e.id);}}
function setCoachVoice(v){stopCoach();S.coachVoices=S.coachVoices||{};S.coachVoices[S.coachStyle||'woman']=v;save();}
function stopCoach(){animateCoach(false);if('speechSynthesis' in window)window.speechSynthesis.cancel();coachUtterances=[];document.querySelectorAll('[id^="voice-status-"]').forEach(el=>el.textContent='Coach stopped.');}
function speakExercise(id){
 if(!('speechSynthesis' in window)){toast('Spoken coaching is unavailable in this browser.');return;}
 const e=activeWorkout?.exercises.find(x=>x.id===id)||ALL_EX.find(x=>x.id===id);if(!e)return;
 stopCoach();const style=S.coachStyle||'woman',voices=voiceList(),saved=S.coachVoices?.[style];
 const preferred=style==='woman'?/Samantha|Karen|Moira|Tessa|Victoria|Susan|Zira|Ava|Serena|female/i:/Daniel|Alex|Fred|David|Mark|George|Tom|\bmale\b/i;
 const voice=voices.find(v=>v.voiceURI===saved)||voices.find(v=>/^en/.test(v.lang)&&preferred.test(v.name))||voices.find(v=>/^en/.test(v.lang));
 const intro=style==='drill'?'All right. Focus on technique. '+e.name+'. Set your position.':"Let's work through "+e.name+'. Take your time and stay in control.';
 const lines=[intro,...e.steps.map((s,i)=>'Step '+(i+1)+'. '+s),...(e.tips||[]).map(s=>'Key point. '+s),style==='drill'?'Controlled repetitions. No rushing. Rest when you need it.':'Keep the movement comfortable and rest whenever you need.'];
 const status=document.getElementById('voice-status-'+id);coachUtterances=lines.map((line,i)=>{const u=new SpeechSynthesisUtterance(line);if(voice)u.voice=voice;u.lang=voice?.lang||'en-US';u.rate=style==='drill'?.94:.86;u.pitch=style==='drill'?.86:1;u.onstart=()=>{animateCoach(true);if(status)status.textContent=line;};u.onend=()=>{if(i===lines.length-1){animateCoach(false);if(status)status.textContent='Guidance complete. Replay anytime.';}};u.onerror=ev=>{animateCoach(false);if(status&&!['interrupted','canceled'].includes(ev.error))status.textContent='Tap Start coach again to start audio.';};return u;});
 coachUtterances.forEach(u=>window.speechSynthesis.speak(u));lastSpokenExercise=id;
}
function coachNext(delta){stopCoach();coachIndex=Math.max(0,Math.min(activeWorkout.exercises.length-1,coachIndex+delta));render();if(S.voice)speakExercise(activeWorkout.exercises[coachIndex].id);}
function alternativeGroups(id){const cur=activeWorkout?.exercises.find(e=>e.id===id);if(!cur)return {same:[],other:[]};const used=new Set(activeWorkout.exercises.filter(e=>e.id!==id).map(e=>e.id));const pool=EX.filter(x=>x.id!==id&&!used.has(x.id)&&compatible(x)&&S.prefs[x.id]!=='never'&&x.type===cur.type);return {same:pool.filter(x=>x.p===cur.p),other:pool.filter(x=>x.p!==cur.p)};}
function replaceWorkout(){if(!activeWorkout)return;showModal(`<h2>Alternative workout</h2><p class="muted">Choose a fresh plan using your readiness and available equipment.</p><button class="primary" onclick="confirmAlternativeWorkout()">Build a different workout</button>`);}
function confirmAlternativeWorkout(){const previous=structuredClone(activeWorkout),oldIds=new Set(previous.exercises.map(e=>e.id)),prefs={...S.prefs};oldIds.forEach(id=>{if(previous.kind!=='mixed'||previous.exercises.find(e=>e.id===id)?.type==='strength')S.prefs[id]='never';});closeModal();generate();S.prefs=prefs;save();if(activeWorkout?.id===previous.id){toast('No complete new plan fits your current choices. Try individual alternatives.');return;}undoStack.push(JSON.stringify(previous));if(undoStack.length>20)undoStack.shift();toast('New alternative workout ready. Undo restores the previous plan.');}

function setWorkoutView(single){stopCoach();S.avatarMode=single==='avatar';S.coach=single!==false;save();render();}
render();

let muscleFilters={group:'All',query:'',equipment:'All',compatibleOnly:true};
function muscleMatches(){return EX.filter(e=>e.type==='strength'&&(muscleFilters.group==='All'||e.p===muscleFilters.group||(e.s||[]).includes(muscleFilters.group))&&(!muscleFilters.query||[e.name,e.p,...(e.s||[]),...e.eq].join(' ').toLowerCase().includes(muscleFilters.query.toLowerCase().trim()))&&(muscleFilters.equipment==='All'||e.eq.includes(muscleFilters.equipment))&&(!muscleFilters.compatibleOnly||compatible(e)));}
function muscleLibrary(){return `<div class="container"><section class="card"><div class="eyebrow">Strength exercises</div><h1>Muscle Groups</h1><p class="muted">Find moves for your main and supporting muscles.</p><div class="field"><label for="muscle-group">Muscle group</label><select id="muscle-group" onchange="muscleFilters.group=this.value;muscleResults()">${['All',...MUSCLES].map(m=>`<option ${m===muscleFilters.group?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="field"><label for="muscle-search">Search exercises</label><input id="muscle-search" type="search" placeholder="Exercise, muscle, or equipment" value="${esc(muscleFilters.query)}" oninput="muscleFilters.query=this.value;muscleResults()"></div><div class="field"><label for="muscle-equipment">Equipment</label><select id="muscle-equipment" onchange="muscleFilters.equipment=this.value;muscleResults()">${['All',...new Set(EX.filter(e=>e.type==='strength').flatMap(e=>e.eq))].map(q=>`<option ${q===muscleFilters.equipment?'selected':''}>${esc(q)}</option>`).join('')}</select></div><label class="check"><input type="checkbox" ${muscleFilters.compatibleOnly?'checked':''} onchange="muscleFilters.compatibleOnly=this.checked;muscleResults()"><span>Use my equipment and position settings</span></label><p class="small muted">Change your equipment and allowed positions on Today. Uncheck to browse all exercises.</p></section><div id="muscle-results" aria-live="polite">${muscleCards()}</div></div>`;}
function muscleCards(){const items=muscleMatches();return `<p class="small muted">${items.length} exercise${items.length===1?'':'s'}</p>`+(items.length?items.map(e=>`<section class="card"><h2>${esc(e.name)}</h2><p class="small"><b>Main:</b> ${esc(e.p)}${e.s?.length?` · <b>Supporting:</b> ${e.s.map(esc).join(', ')}`:''}</p><p class="small muted">${e.eq.map(esc).join(', ')} · ${esc(e.position||'standing')}</p><details><summary>Instructions and illustrations</summary>${embeddedDemo(e)||`<ol>${e.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`}</details></section>`).join(''):'<section class="card"><p>No matching exercises. Try another muscle or equipment choice, or browse without your settings filter.</p></section>');}
function muscleResults(){document.getElementById('muscle-results').innerHTML=muscleCards();}

</script>
